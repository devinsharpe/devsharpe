# Local development stack. `docker compose up`, then open http://localhost:3000.
#
#   app       TanStack Start dev server; the source is mounted, so edits hot-reload
#   postgres  database; pending migrations run each time the app starts
#   rustfs    S3-compatible storage for media; console at http://localhost:9001
#   imgproxy  renders media straight from the bucket
#
# The app still reads the rest of its settings (BETTER_AUTH_*, DQC_*, ...) from
# .env; the values below replace the same names from there. Every credential
# here is a fixed dev value for this stack only; never reuse one elsewhere.
#
# Host ports can be moved with POSTGRES_PORT, S3_PORT, S3_CONSOLE_PORT and
# IMGPROXY_PORT (set them in the shell or .env). `docker compose down -v`
# deletes the database, the uploaded files and the installed node_modules.

name: devsharpe

x-dev-values:
  bucket: &bucket devsharpe-media
  s3-access-key: &s3-access-key devsharpe
  s3-secret-key: &s3-secret-key devsharpe-dev-secret
  imgproxy-key: &imgproxy-key c790fd61276bfa0783a2f885afef8682c0e45cdbc4fb0ed6893f6b0de377c2dc
  imgproxy-salt: &imgproxy-salt 47017c568e18c5782cf2936d1b8b9cb1ce5726774b5362a19b7bc7a33d27c718

services:
  app:
    image: node:26-trixie-slim
    working_dir: /app
    command: ["sh", "docker/dev-entrypoint.sh"]
    init: true
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # Linux builds of the dependencies, kept apart from the host's.
      - app-node-modules:/app/node_modules
      - npm-cache:/root/.npm
    environment:
      DATABASE_URL: postgresql://devsharpe:devsharpe@postgres:5432/devsharpe
      S3_BUCKET: *bucket
      S3_REGION: us-east-1
      S3_ENDPOINT: http://rustfs:9000
      # Upload URLs are signed for the host the browser sends them to.
      S3_PUBLIC_ENDPOINT: http://localhost:${S3_PORT:-9000}
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: *s3-access-key
      S3_SECRET_ACCESS_KEY: *s3-secret-key
      # Pages allowed to upload to the bucket (docker/setup-bucket.mjs).
      S3_CORS_ORIGINS: http://localhost:3000
      IMGPROXY_URL: http://localhost:${IMGPROXY_PORT:-8080}
      IMGPROXY_KEY: *imgproxy-key
      IMGPROXY_SALT: *imgproxy-salt
      IMGPROXY_SOURCE_PREFIX: ""
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      imgproxy:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: devsharpe
      POSTGRES_PASSWORD: devsharpe
      POSTGRES_DB: devsharpe
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images keep their data under /var/lib/postgresql/<major>.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsharpe -d devsharpe"]
      interval: 2s
      timeout: 5s
      retries: 30

  rustfs:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: *s3-access-key
      RUSTFS_SECRET_KEY: *s3-secret-key
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 5s
      retries: 30

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v4.0.24
    environment:
      IMGPROXY_KEY: *imgproxy-key
      IMGPROXY_SALT: *imgproxy-salt
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://rustfs:9000
      IMGPROXY_S3_ENDPOINT_USE_PATH_STYLE: "true"
      IMGPROXY_S3_REGION: us-east-1
      IMGPROXY_S3_ALLOWED_BUCKETS: *bucket
      IMGPROXY_ALLOWED_SOURCES: s3://devsharpe-media/
      AWS_ACCESS_KEY_ID: *s3-access-key
      AWS_SECRET_ACCESS_KEY: *s3-secret-key
      IMGPROXY_DEVELOPMENT_ERRORS_MODE: "true"
    ports:
      - "${IMGPROXY_PORT:-8080}:8080"
    depends_on:
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  app-node-modules:
  npm-cache:
  postgres-data:
  rustfs-data:
